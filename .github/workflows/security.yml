name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    if: github.event.repository.visibility == 'public'
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, cpp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: matrix.language == 'javascript-typescript'
        run: npm ci
      - if: matrix.language == 'javascript-typescript'
        run: npm run build
      - if: matrix.language == 'cpp'
        run: cmake -S native/discord-bridge -B build/native -DRRP_DISCORD_STUB=ON -DRRP_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - if: matrix.language == 'cpp'
        run: cmake --build build/native --config Release --parallel
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: GPL-3.0, AGPL-3.0

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
